name: bou_reminder
description: বউ রিমাইন্ডার — সংসারের সব জরুরি কথা, সময়মতো।
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State & architecture ──
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^18.0.2

  # ── UI & animation ──
  flutter_animate: ^4.5.2
  rive: ^0.14.11
  lottie: ^3.6.1
  confetti: ^0.8.0
  animations: ^3.0.0
  skeletonizer: ^3.0.0
  flutter_slidable: ^4.0.3

  # ── Utils ──
  intl: any
  collection: ^1.19.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/rive/
    - assets/lottie/
    - assets/images/
    - assets/data/
    - assets/sounds/
  fonts:
    - family: BalooDa2
      fonts:
        - asset: "assets/fonts/BalooDa2[wght].ttf"
          weight: 500
        - asset: "assets/fonts/BalooDa2[wght].ttf"
          weight: 600
        - asset: "assets/fonts/BalooDa2[wght].ttf"
          weight: 700
        - asset: "assets/fonts/BalooDa2[wght].ttf"
          weight: 800
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
    - family: TiroBangla
      fonts:
        - asset: assets/fonts/TiroBangla-Regular.ttf
        - asset: assets/fonts/TiroBangla-Italic.ttf
          style: italic
